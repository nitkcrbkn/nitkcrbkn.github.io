---
layout: default
---
<header class="page-heading"><h1>{{ page.title }}</h1><p class="lede">{{ page.description }}</p></header>
<div class="contact-layout"><div class="prose-block">{{ content }}</div><section class="contact-panel" aria-labelledby="contact-title"><h2 id="contact-title">公式アカウントへ連絡する</h2>{% for method in site.data.site.contact.methods %}<p>{{ method.name }}</p><a class="contact-account" href="{{ method.url }}">{{ method.value }}<span aria-hidden="true">{% include icon_chevron.html %}</span></a>{% endfor %}<p class="contact-note">アカウントのページを開き、DMでご連絡ください。</p></section></div>
