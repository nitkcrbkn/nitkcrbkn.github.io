---
layout: default
---
<section class="page-hero panel">
  {% if page.kicker %}
    <p class="eyebrow">{{ page.kicker }}</p>
  {% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.description %}
    <p class="lede">{{ page.description }}</p>
  {% endif %}
</section>

<section class="panel prose-block">
  {{ content }}
</section>
