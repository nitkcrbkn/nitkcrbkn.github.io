<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ja' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign page_title = page.title | default: site.title %}
  {% if page_title == site.title %}
    <title>{{ site.title }}</title>
  {% else %}
    <title>{{ page_title }} | {{ site.title }}</title>
  {% endif %}
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
  <div class="page-shell">
    {% include site_header.html %}
    <main class="page-main" id="main-content">
      {{ content }}
    </main>
    {% include site_footer.html %}
  </div>
  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
