---
layout: default
---
<article class="entry entry-post">
  <section class="page-hero panel">
    <a class="back-link" href="{{ '/blog/' | relative_url }}">記事一覧へ戻る</a>
    <h1>{{ page.title }}</h1>
    <div class="entry-meta">
      <span>{{ page.date | date: "%Y.%m.%d" }}</span>
    </div>
  </section>

  <section class="panel prose-block">
    {{ content }}
  </section>
</article>
