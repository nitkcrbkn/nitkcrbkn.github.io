---
layout: default
---
<article class="entry entry-robot">
  <section class="robot-hero panel">
    <div class="robot-hero__copy">
      <a class="back-link" href="{{ '/robot/' | relative_url }}">ロボ紹介へ戻る</a>
      <h1>{{ page.title }}</h1>
      <div class="entry-meta">
        {% if page.year %}
          <span>{{ page.year }}</span>
        {% endif %}
      </div>
      {% if page.overview %}
        <p class="lede">{{ page.overview }}</p>
      {% endif %}
    </div>
    <div class="robot-hero__visual">
      {% assign hero_image = page.image | default: '/assets/images/roboken.png' %}
      <img src="{{ hero_image | relative_url }}" alt="{{ page.title }}">
    </div>
  </section>

  <section class="panel prose-block">
    {{ content }}
  </section>
</article>
