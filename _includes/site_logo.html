<span class="theme-logo {{ include.class }}" aria-label="{{ site.data.site.branding.logo_alt }}" role="img">
  <img
    class="theme-logo__image theme-logo__image--light"
    src="{{ site.data.site.branding.logo_white | relative_url }}"
    alt=""
    decoding="async"
  >
  <img
    class="theme-logo__image theme-logo__image--dark"
    src="{{ site.data.site.branding.logo_black | relative_url }}"
    alt=""
    decoding="async"
  >
</span>
