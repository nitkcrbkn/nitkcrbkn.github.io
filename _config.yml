title: 木更津高専ロボット研究同好会
description: 木更津高専ロボット研究同好会の公式サイトです。ロボット紹介や活動報告を掲載しています。
baseurl: ""
url: https://nitkcrbkn.github.io
lang: ja

collections:
  robots:
    output: true
    permalink: /robot/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:title/
      published: true
  - scope:
      path: ""
      type: robots
    values:
      layout: robot_entry
      published: true

markdown: kramdown
theme: null
permalink: pretty

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
