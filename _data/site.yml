      description: ロボットの移動に使う台車をご提供いただいています。
      url: https://www.gop.co.jp/products/
      url_label: 製品情報を見る
    - name: 東京湾横断道路株式会社様
      category: 地域からの支援
      description: 木更津に根ざした企業から、ロボ研の活動を応援していただいています。地域からの応援を心強く感じています。
      url: https://www.aqua-line.co.jp/
      url_label: 企業サイトを見る
    - name: 株式会社三協リール様
      category: 設備支援
      description: コードリールによるご支援は、配線や作業環境を整え、日々の整備や準備を安定して進める助けになっています。
      url: https://www.triens.jp/
      url_label: 企業サイトを見る

