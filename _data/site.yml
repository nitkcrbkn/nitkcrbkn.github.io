robot_archive_intro: 旧サイトに残る初期の記録から、全国大会に挑んだ近年の機体まで、ロボ研の歩みを年度ごとにたどれます。

contact:
  intro: 外部からのお問い合わせは X (旧Twitter) の DM が最も確実です。あわせて、旧公式サイトに掲載されていたメールアドレスや公開アーカイブも案内しています。
  methods:
    - name: X (旧Twitter)
      value: "@kisarazu_RBKN"
      url: https://x.com/kisarazu_RBKN
      note: 新歓や展示、見学相談などはこちらがもっとも早くつながります。
    - name: Email
      value: knctrbknpr@gmail.com
      url: mailto:knctrbknpr@gmail.com
      note: 旧公式サイトにも掲載されている連絡先です。返信に時間がかかる場合があります。
    - name: YouTube
      value: 木更津高専ロボット研究同好会
      url: https://www.youtube.com/channel/UCXd_QHewbV86jjEoDyFc0Gw
      note: 活動場所案内や動画アーカイブを公開しています。
    - name: GitHub
      value: nitkcrbkn
      url: https://github.com/nitkcrbkn
      note: 技術ドキュメントや公開レポートの導線があります。
  editorial_note: 速報性の高い情報は X、活動の蓄積はこのサイトや各種アーカイブへ、という形で発信の場を使い分けています。

footer:
  tagline: 高専ロボコンを中心に、競技ロボット、地域展示、技術アーカイブまでをつないで紹介しています。
