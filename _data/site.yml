stats:
  - value: 設計 / 加工 / 制御
    label: 分担しながら横断して学ぶ
  - value: 試作から実機まで
    label: アイデアを現場で検証する
  - value: 記録も自分たちで残す
    label: 活動を次年度へつなげる

highlights:
  - title: Hands-on なものづくり
    description: CAD、加工、配線、プログラムまで、机上で終わらない学びを積み上げます。
  - title: 競技を読み、設計で詰める
    description: ルール解釈から戦略、試作、調整までを何度も往復しながら完成度を上げます。
  - title: 発信まで含めてチーム活動
    description: 活動記録や大会後のふり返りを記事に残し、外からも中からも見える同好会を目指します。

about:
  lead: ロボットは、一人の得意分野だけでは完成しません。アイデアを形にする人、構造を詰める人、制御を安定させる人、活動を記録して次につなげる人。それぞれの役割を持ち寄りながら、チームとして完成度を上げていきます。
  pillars:
    - title: 発想と戦略
      description: 競技ルールを読み込み、何を勝ち筋にするかを議論しながら、ロボット全体の方向性を決めます。
    - title: 設計と試作
      description: CADや加工を通じて、思いつきを実際に動く形へ落とし込み、成立条件を確かめます。
    - title: 回路と制御
      description: センサ、モータ、制御ロジックを組み合わせ、安定して動く挙動へ仕上げていきます。
    - title: 記録と改善
      description: 製作メモや記事を残し、翌年以降も活用できる知見として整理します。
  workflow:
    - title: 企画
      description: 競技の目的や制約を整理し、どんな構成が有効かをチームで言語化する段階です。
    - title: 検証
      description: 小さな試作と議論を繰り返し、機構や操作性が本当に成立するかを早めに見極めます。
    - title: 実装
      description: 分担して実機を組み上げつつ、機械、電装、ソフトを接続しながら全体の完成度を上げます。
    - title: 調整
      description: 本番を想定した動作確認と改善を重ね、安定性と再現性を詰めていきます。
  values:
    - title: 自分の専門外にも触れる
      description: 機械系でもソフトの視点を、ソフト系でも現場の構造理解を持てるように活動します。
    - title: 試して学ぶ
      description: 完璧な案を待つよりも、まず形にしてみて次の改善点を見つけることを重視します。
    - title: 残して共有する
      description: 口頭だけで終わらせず、記事や記録として残すことでチームの資産にします。

contact:
  intro: 外部からのお問い合わせは、現在 X (旧Twitter) の DM を窓口にしています。
  methods:
    - name: X (旧Twitter)
      value: "@kisarazu_RBKN"
      url: https://x.com/kisarazu_RBKN
      note: 顧問管理のアカウントです。返信まで少し時間をいただくことがあります。
    - name: GitHub
      value: nitkcrbkn/nitkcrbkn.github.io
      url: https://github.com/nitkcrbkn/nitkcrbkn.github.io
      note: サイトの更新履歴や記事データはこちらで管理しています。
  editorial_note: 記事の更新は GitHub 上の Markdown をもとに行っており、ブラウザだけで扱える Pages CMS にも対応しています。

footer:
  tagline: 高専ロボコンに向けた活動記録とチーム紹介を掲載しています。
