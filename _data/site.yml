stats:
  - value: "2013"
    label: 「カブ跳ムシ」技術賞
  - value: "2016"
    label: 「伊能運搬隊」アイデア倒れ賞
  - value: "2024"
    label: 8年ぶり全国大会 / デザイン賞
  - value: "2025"
    label: 2年連続全国大会 / 安川電機特別賞

highlights:
  - title: 機械と制御の協働
    description: 機構設計、加工、配線、プログラムを行き来しながら、実機の完成度を上げていきます。
  - title: Aチーム・Bチーム制
    description: 同じ競技課題に対して別案を育てることで、機構も世界観も異なるロボットが並行して生まれます。
  - title: 技術を残す文化
    description: GitHub Pages や Doxygen で制御系ドキュメントを公開し、次年度へ知見をつないでいます。
  - title: 地域に開くものづくり
    description: 展示・操縦体験、学校広報、外部取材を通して、ロボットづくりの面白さを学外にも届けています。

about:
  lead: ロボットは、一人の得意分野だけでは完成しません。機械、制御、運営、記録の力を持ち寄りながら、毎年の競技課題に向き合っています。
  workflow:
    - title: ルール読解と発想
      description: 年度テーマを読み解き、どの動きで勝負するか、どんな見せ場をつくるかをチームで議論します。
    - title: 試作と分担
      description: Aチーム・Bチームの中で機械班と制御班が役割を持ち、試作を重ねながら構想を実機へ落とし込みます。
    - title: 統合と調整
      description: 機械、回路、ソフトをつなぎ込み、本番を想定したテストで再現性と操作性を詰めていきます。
    - title: 本番と継承
      description: 大会、展示、取材、アーカイブ公開まで含めて活動を次の年度につなげます。
  values:
    - title: まず動かして確かめる
      description: アイデアを早めに形にして、実際に動かしながら改善点を見つけます。
    - title: 専門を越えて協力する
      description: 機械、制御、運営、記録の境目を越え、全体を見ながら一台を仕上げます。
    - title: 見せ方にもこだわる
      description: 点数だけでなく、テーマ性やデザイン、会場を沸かせる動きもロボコンの魅力として大切にします。
    - title: 活動を外へ開く
      description: 展示や体験会、学校広報、オンライン発信を通して、ロボットづくりの楽しさを共有します。

organization:
  intro: 年度ごとに細部は変わりますが、ロボ研は専門分担とチーム戦を組み合わせた体制で動いています。
  groups:
    - title: 機械班
      description: フレーム、駆動、リンク機構、加工、組み立てを担い、アイデアを実際に動く形へ落とし込みます。
    - title: 制御班
      description: 回路、配線、センサ、プログラム、通信系を担当し、安定して再現できる挙動をつくります。
    - title: Aチーム / Bチーム
      description: 同じ競技課題に対して別案を育てることで、機構も世界観も異なるロボットが並行して生まれます。
    - title: マネージャー / 記録
      description: 進行管理、作業場所の調整、情報共有、発信まで含めて、開発全体を前に進める役割です。
  operations:
    - title: コードと情報の共有
      description: 制御系の開発ではクラウドを活用して情報を共有し、チーム全員が状態を追える環境づくりを大切にしています。
    - title: ヒューマンエラーの予防
      description: バッテリーや空気弁の確認など、本番前に抜け漏れが出やすい箇所には張り紙や手順確認で備えます。
    - title: 部品調達と検討
      description: Web の eカタログだけでなく紙カタログも併用し、予算と納期を見ながら必要な部品を選定します。
    - title: 顧問・OBとの連携
      description: 顧問教員の支援や OB お披露目会での技術交流を通して、学年を越えた知見の継承を進めています。

technical:
  intro: 競技用ロボットの背後には、実機を安定して動かすための組込み制御と検証の積み重ねがあります。公開している技術アーカイブから、ロボ研のものづくりの一端を見ることができます。
  items:
    - title: STM32ベースの制御基盤
      description: 公開 Doxygen では、STM32 マイコン向けのロボット制御システムとしてレイヤ分離された構成が紹介されています。
    - title: ロギング / CAN / デバッグ
      description: ログ出力、CAN 通信、デバッグストリームなど、本番機の確認と調整を支える機能が文書化されています。
    - title: テストと継続的な整備
      description: Catch2 を使ったユニットテストや CI/CD 生成物の公開から、制御ソフトを継続的に磨く姿勢がうかがえます。
  links:
    - label: GitHub Pages
      title: CI/CD レポート
      description: 自動生成されたカバレッジやドキュメントの公開先です。
      url: https://github.com/nitkcrbkn/pages
      url_label: GitHub を見る
    - label: Doxygen
      title: STM32System ドキュメント
      description: 制御システムの概要、モジュール、通信まわりの説明を読むことができます。
      url: https://nitkcrbkn.github.io/pages/develop/doxygen/index.html
      url_label: ドキュメントを開く

achievements_intro: 大会結果だけでなく、アイデアやデザイン、技術の積み重ねが評価されてきた歩みがあります。
achievements:
  - year: "2013"
    title: カブ跳ムシが技術賞
    description: 関東甲信越地区大会で技術賞を受賞。現在まで動く展示機として地域イベントにも登場しています。
  - year: "2016"
    title: 伊能運搬隊が全国大会でアイデア倒れ賞
    description: 伊能忠敬をモチーフにした大胆な世界観と約5mロッドの機構で、木更津らしい発想力を印象づけました。
  - year: "2024"
    title: きさぺん越冬隊がデザイン賞
    description: 8年ぶりに全国大会へ進出し、ペンギンをモチーフにした機体で全国大会デザイン賞を受賞しました。
  - year: "2025"
    title: それゆけキサンタクロースが2年連続全国大会へ
    description: Aチームが地区最高得点で全国大会出場を決め、Bチームのオクト pass gate も安川電機特別賞を受賞しました。

history_intro: 旧サイトに残る記録から最近の学校公式記事まで、ロボ研の歩みは少しずつつながっています。
history:
  - year: "2010"
    title: 旧サイトに活動準備の記録
    description: 旧公式サイトには、高専ロボコン2010へ向けて準備を進める様子が残っており、現在につながる活動の出発点のひとつになっています。
  - year: "2013"
    title: 周年だぬき / カブ跳ムシの記録
    description: 旧公式サイトやギャラリーに当時の製作ロボットが残り、2013年シーズンの挑戦をたどることができます。
  - year: "2016"
    title: 伊能運搬隊で全国大会へ
    description: 千葉ゆかりの伊能忠敬をテーマに据え、見た目の楽しさと大胆な機構を両立したロボットで全国大会に出場しました。
  - year: "2024"
    title: きさぺん越冬隊で全国舞台へ帰還
    description: 木更津高専が関東甲信越地区大会の主管校を務めた年、Aチームが全国大会出場とデザイン賞をつかみました。
  - year: "2025"
    title: 2年連続全国大会出場
    description: Aチーム「それゆけキサンタクロース」が地区最高得点を記録し、Bチーム「オクト pass gate」も特別賞を受賞しました。
  - year: "2026"
    title: 学校だよりで2025シーズンを総括
    description: 地区大会から全国大会までの流れや改良の歩みが学校広報に掲載され、ロボ研の挑戦が次の世代へ共有されています。

support:
  note: ロボ研の活動は、技術提供や設備面の後押し、地域からの応援に支えられています。日頃よりお力添えをいただいている皆さまを紹介します。
  companies:
    - name: STマイクロエレクトロニクス
      category: Technical Support
      description: 2025年7月、STM32マイコンをご提供いただきました。制御系の試作、ファームウェア開発、周辺機能の検証を進めるための基盤として活用しています。
      url: https://x.com/kisarazu_RBKN/status/1943513142883160210
      url_label: X の投稿を見る
    - name: GOP
      category: Equipment Support
      description: 作業台や台車など、製作現場を支える設備面でお力添えをいただいています。機体製作や整備を進めやすい環境づくりの支えになっています。
      url: https://www.gop.co.jp/products/
      url_label: 製品情報を見る
    - name: 東京湾横断道路株式会社
      category: Local Support
      description: 木更津に根ざした企業として、ロボ研の挑戦を応援していただいています。地域に支えられながら活動を続けるうえで、心強い存在です。
      url: https://www.aqua-line.co.jp/
      url_label: 企業サイトを見る
    - name: 三協リール
      category: Equipment Support
      description: エア・コードリールや周辺機器を通して、配線や作業環境まわりを支えていただいています。日々の整備や準備を安定して進める力になっています。
      url: https://www.triens.jp/
      url_label: 企業サイトを見る
  partners:
    - name: STマイクロエレクトロニクス
      description: STM32マイコンのご提供を通して、制御開発の基盤づくりを支えていただいています。
    - name: GOP
      description: 製作現場の安全性と作業性を支える設備面でお力添えをいただいています。
    - name: 東京湾横断道路株式会社
      description: 木更津の地域企業として、ロボ研の挑戦を応援していただいています。
    - name: 三協リール
      description: 製作環境や配線まわりを支える設備面でお力添えをいただいています。

outreach_intro: 競技用ロボットは大会だけで終わらず、地域や学校の外にも持ち出され、次の出会いを生んでいます。
outreach:
  - year: "2024"
    label: Workshop
    title: イオンモール木更津で展示・操縦体験
    description: 過去の高専ロボコン出場機を展示し、子どもたちが実際にロボットを動かせる体験イベントを実施しました。
  - year: "2024"
    label: Visit
    title: 木更津市長を表敬訪問
    description: 地区大会の開催や全国大会出場の報告を行い、地域からの応援に感謝を伝えました。
  - year: "2025"
    label: Workshop
    title: 展示・操縦体験 第2弾
    description: イオンモール木更津での第2弾には小中学生39名が参加し、3台のロボットが体験機として活躍しました。
  - year: "2025"
    label: OB Event
    title: OBお披露目会を開催
    description: Aチーム・Bチームの機体を卒業生へ披露し、全国大会へ向けた改良のヒントや交流の時間につなげました。

media_intro: 日々の発信から過去アーカイブまで、いくつもの窓口にロボ研の記録が残っています。
media:
  - label: X
    title: 公式X
    description: 新歓、展示、ロボコン関連のお知らせなど、いちばん機動的な情報発信の場です。
    url: https://x.com/kisarazu_RBKN
    url_label: X を見る
  - label: YouTube
    title: 活動場所案内と動画アーカイブ
