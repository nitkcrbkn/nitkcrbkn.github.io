club:
  school: 木更津工業高等専門学校
  name: 木更津高専ロボット研究同好会
  short_name: ロボット研究同好会
  description: NHK高専ロボコンを中心に、機械班と制御班が連携しながらロボットを設計・製作し、地域展示や技術発信にも取り組む学生同好会です。

branding:
  logo_black: /assets/images/club-logo-black.svg
  logo_white: /assets/images/club-logo-white.svg
  logo_alt: 木更津高専ロボット研究同好会 ロゴ
  mark_label: RBKN Robotics Club

hero:
  eyebrow: National Institute of Technology, Kisarazu College
  title: アイデアを機構へ、機構を走るロボットへ。
  body: 木更津高専ロボット研究同好会は、高専ロボコンに向けて、機構、制御、デザイン、発信までを学生主体で積み上げるチームです。日々の製作、歴代ロボット、活動記録を通して、ロボ研のものづくりを紹介しています。
  badge: NHK高専ロボコンに挑戦
  primary_label: 活動紹介を見る
  primary_url: /about/
  secondary_label: 歴代ロボを見る
  secondary_url: /robot/
  notes:
    - 機械班と制御班が並走して一台を仕上げる
    - Aチーム・Bチームで異なるアイデアを育てる
