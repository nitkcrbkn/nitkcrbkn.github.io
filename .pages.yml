media:
  input: assets/images
  output: /assets/images

content:
  - name: posts
    label: 記事
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date, summary]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: date
        label: 公開日
        type: date
        required: true
      - name: summary
        label: 一言説明
        type: text
      - name: category
        label: カテゴリ（大会・展示／体験・ご支援など）
        type: string
      - name: image
        label: 一覧に表示する写真（任意）
        type: image
      - name: image_width
        label: 写真の幅（px）
        type: number
      - name: image_height
        label: 写真の高さ（px）
        type: number
      - name: published
        label: 公開する
        type: boolean
        default: true
      - name: body
        label: 本文
        type: rich-text

  - name: robots
    label: ロボ紹介
    type: collection
    path: _robots
    format: yaml-frontmatter
    filename: "{year}-{primary}.md"
    view:
      fields: [title, year, team, award]
      primary: title
      sort: [year, title]
      default:
        sort: year
        order: desc
    fields:
      - name: title
        label: 機体名
        type: string
        required: true
      - name: year
        label: 年度
        type: number
        required: true
      - name: team
        label: チーム
        type: string
      - name: competition
        label: 競技テーマ
        type: string
      - name: award
        label: 受賞・実績
        type: string
      - name: overview
        label: 概要
        type: text
      - name: image
        label: 代表写真（一覧・詳細の先頭）
        type: image
      - name: image_width
        label: 写真の幅（px）
        type: number
      - name: image_height
        label: 写真の高さ（px）
        type: number
      - name: image_alt
        label: 写真の説明（代替テキスト）
        type: string
      - name: image_caption
        label: 写真の下に表示する説明
        type: string
      - name: image_source
        label: 写真の出典URL（木更津高専）
        type: string
      - name: gallery
        label: 追加の写真（登録順に表示）
        type: object
        list: true
        fields:
          - name: image
            label: 写真
            type: image
            required: true
          - name: alt
            label: 写真の説明（代替テキスト）
            type: string
            required: true
          - name: caption
            label: 写真の下に表示する説明
            type: text
          - name: source_url
            label: 出典URL（任意）
            type: string
          - name: source_label
            label: 出典の表示名（任意）
            type: string
          - name: width
            label: 写真の幅（px・任意）
            type: number
          - name: height
            label: 写真の高さ（px・任意）
            type: number
      - name: published
        label: 公開する
        type: boolean
        default: true
      - name: body
        label: 詳細
        type: rich-text

  - name: hero_slides
    label: トップの写真
    type: file
    path: _data/hero_slides.yml
    format: yaml
    list: true
    fields:
      - name: image
        label: 写真
        type: image
        required: true
      - name: alt
        label: 写真の説明（代替テキスト）
        type: string
        required: true
      - name: caption
        label: 表示する説明
        type: string
      - name: source_url
        label: 出典URL
        type: string
      - name: source_label
        label: 出典の表示名
        type: string

  - name: contact
    label: お問い合わせページ
    type: file
    path: contact.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: description
        label: 説明
        type: text
      - name: body
        label: 本文
        type: rich-text

  - name: site_settings
    label: サイト設定
    type: file
    path: _data/site.yml
    format: yaml
    fields:
      - name: branding
        label: ロゴ設定
        type: object
        fields:
          - name: logo_black
            label: ロゴ画像（黒）
            type: image
          - name: logo_white
            label: ロゴ画像（白）
            type: image
          - name: logo_alt
            label: ロゴの代替テキスト
            type: string
          - name: logo_note
            label: ロゴ横の注記
            type: text

settings:
  content:
    merge: true
